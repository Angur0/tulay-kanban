version: "3.8"

services:
  db:
    image: postgres:15
    container_name: tulay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tulay-kanban-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tulay-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-kanban}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_DIR: /app/uploads
      BASE_URL: http://tulay-kanban.internal
    volumes:
      - uploads_data:/app/uploads
    networks:
      - tulay-kanban-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tulay-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    networks:
      - tulay-kanban-net

  dns:
    image: alpine:3.18
    container_name: tulay-dns
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
      apk add --no-cache dnsmasq &&
      echo 'no-resolv' > /etc/dnsmasq.conf &&
      echo 'no-hosts' >> /etc/dnsmasq.conf &&
      echo 'address=/tulay-kanban.internal/${HOST_TAILSCALE_IP}' >> /etc/dnsmasq.conf &&
      echo 'server=1.1.1.1' >> /etc/dnsmasq.conf &&
      echo 'server=8.8.8.8' >> /etc/dnsmasq.conf &&
      dnsmasq -k
      "
    environment:
      - HOST_TAILSCALE_IP=${HOST_TAILSCALE_IP}
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks:
      - tulay-kanban-net

volumes:
  postgres_data:
  uploads_data:

networks:
  tulay-kanban-net:
    driver: bridge
