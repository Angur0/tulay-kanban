<!doctype html>
<html class="light" lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Tulay Kanban</title>
	<meta name="description" content="A real-time Kanban board powered by Apache Kafka for task event streaming" />
	<!-- Tailwind CSS -->
	<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
		rel="stylesheet" />
	<!-- Material Symbols -->
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
		rel="stylesheet" />
	<!-- Tailwind Config -->
	<script>
		tailwind.config = {
			darkMode: "class",
			theme: {
				extend: {
					colors: {
						"primary": "#2b8cee",
						"background-light": "#f6f7f8",
						"background-dark": "#101922",
					},
					fontFamily: {
						"display": ["Inter", "sans-serif"]
					},
					borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
				},
			},
		}
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover"
	class="bg-background-light dark:bg-background-dark text-[#111418] dark:text-white font-display overflow-hidden h-screen flex">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
